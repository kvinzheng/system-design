# Notification fanout pipeline — high-scale variant
#
# Single command: `docker compose up -d` brings up Kafka (Redpanda) + Redis + a
# Kafka UI. Then run the three Node services (producer, fanout, gateway) with
# `npm run dev:all`. See package.json scripts.
#
# Why Redpanda?  API-compatible with Kafka, no ZooKeeper, single binary.
# Trivial to swap for real Kafka in prod.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    container_name: ec-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  redis:
    image: redis:7-alpine
    container_name: ec-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ec-kafka-ui
    depends_on: [redpanda]
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
