<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>priority-notifications · demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p.lead { color: #94a3b8; margin: 0 0 24px; line-height: 1.6; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { background: #334155; color: #f1f5f9; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    button:hover { background: #475569; }
    button.high   { background: #dc2626; }
    button.medium { background: #2563eb; }
    button.low    { background: #6b7280; }
    button.gear   { background: #fbbf24; color: #111; }
    select { background: #334155; color: #f1f5f9; border: 1px solid #475569; border-radius: 4px; padding: 6px; font-size: 13px; }
    .activity { background: #0f172a; border-radius: 8px; padding: 8px 12px; margin-top: 8px; max-height: 200px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; }
    .activity .item { display: flex; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #1e293b; }
    .activity .item:last-child { border-bottom: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.high { background: #dc2626; } .dot.medium { background: #2563eb; } .dot.low { background: #9ca3af; }
    .ts { color: #64748b; font-size: 11px; }
    .chip { display: inline-block; background: #0f172a; padding: 4px 10px; border-radius: 999px; font-size: 12px; margin-left: 8px; }
    .chip.warn { background: #422006; color: #fbbf24; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
